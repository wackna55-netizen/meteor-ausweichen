<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteor-Ausweichen</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1425; color: #f2f6ff; font: 1rem system-ui, sans-serif; }
  main { width: min(100% - 2rem, 29rem); margin: 2rem auto; }
  h1 { font-size: clamp(1.8rem, 7vw, 2.6rem); margin: 0; }
  p { color: #c4d2ea; }
  #feld { width: min(100%, 19rem); margin: 1rem auto; display: grid;
    grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .zelle { aspect-ratio: 1; border: 1px solid #304564; border-radius: 7px; background: #16253d; }
  .spieler { background: #77d9ff; }
  .meteor { background: #ff9b6a; }
  .steuerung { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  button, input { min-height: 44px; padding: .65rem .9rem; border-radius: 8px; font: inherit; }
  button { border: 1px solid #506a92; background: #233959; color: white;
    font-weight: 650; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .55; cursor: default; }
  #start { width: 100%; background: #a6dcff; color: #0b1425; }
  #eintrag { margin-top: 1rem; }
  input { width: 100%; margin: .4rem 0; border: 1px solid #506a92; background: #0f1b2e; color: white; }
  section { margin-top: 1.8rem; border-top: 1px solid #304564; }
  li { padding: .35rem .3rem; overflow-wrap: anywhere; }
  #arcade:has(#herzkammern-panel:not([hidden])) { width: min(100% - 2rem, 58rem); }
</style>
<main id="arcade">
  <h1>Meteor-Ausweichen</h1>
  <p>Steuere dein blaues Schiff mit den Tasten unten oder mit ← und →.</p>
  <strong>Punkte: <output id="punkte">0</output></strong>
  <div id="feld" role="img" aria-label="5 mal 5 Spielfelder"></div>
  <div class="steuerung">
    <button id="links" disabled>← Links</button>
    <button id="rechts" disabled>Rechts →</button>
  </div>
  <p id="status" role="status">Bereit zum Start.</p>
  <button id="start">Spiel starten</button>
  <form id="eintrag" hidden>
    <label for="name">Spitzname für die Rangliste</label>
    <input id="name" required maxlength="20" autocomplete="off">
    <button id="speichern">Punkte speichern</button>
  </form>
  <section>
    <h2>Top 10</h2>
    <p id="rangstatus" role="status"></p>
    <ol id="rang"></ol>
  </section>
</main>
<script>
  // Ersetze die beiden Werte zwischen den Anführungszeichen.
  const SUPABASE_URL = "https://bxrlgvsumgxxobynmbta.supabase.co";
  const SUPABASE_KEY = "sb_publishable_D4xcCwNRl7MdP7uqo9_zgQ_gHe47kvw";

  const $ = id => document.getElementById(id);
  const konfiguriert = !SUPABASE_URL.includes("DEIN-PROJEKT")
    && SUPABASE_KEY.startsWith("sb_publishable_")
    && !SUPABASE_KEY.includes("DEIN_SCHLUESSEL");
  const api = SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/meteor_scores";
  const zellen = Array.from({ length: 25 }, () => {
    const zelle = document.createElement("span");
    $("feld").append(zelle);
    return zelle;
  });

  let spieler = 2, meteorX = 2, meteorY = 0, punkte = 0;
  let laeuft = false, timer, rundenId, speichert = false;
  let rangAnfrage = 0;

  function zeichnen() {
    zellen.forEach(zelle => zelle.className = "zelle");
    zellen[20 + spieler].classList.add("spieler");
    zellen[meteorY * 5 + meteorX].classList.add("meteor");
    $("punkte").textContent = punkte;
  }

  function neuerMeteor() {
    meteorX = Math.floor(Math.random() * 5);
    meteorY = 0;
  }

  function pruefeTreffer() {
    if (meteorY !== 4 || meteorX !== spieler) return false;
    laeuft = false;
    clearTimeout(timer);
    $("links").disabled = $("rechts").disabled = true;
    $("start").disabled = false;
    $("start").textContent = "Nochmal spielen";
    $("status").textContent = "Treffer! Endstand: " + punkte;
    $("eintrag").hidden = !konfiguriert;
    return true;
  }

  function verschieben(richtung) {
    if (!laeuft) return;
    spieler = Math.max(0, Math.min(4, spieler + richtung));
    zeichnen();
    pruefeTreffer();
  }

  function fallen() {
    if (!laeuft) return;
    meteorY += 1;
    if (meteorY > 4) {
      punkte += 1;
      neuerMeteor();
    }
    zeichnen();
    if (!pruefeTreffer()) timer = setTimeout(fallen, Math.max(150, 500 - punkte * 25));
  }

  $("start").onclick = () => {
    spieler = 2;
    punkte = 0;
    rundenId = konfiguriert ? crypto.randomUUID() : null;
    laeuft = true;
    $("eintrag").hidden = true;
    $("start").disabled = true;
    $("links").disabled = $("rechts").disabled = false;
    $("status").textContent = "Runde läuft.";
    neuerMeteor();
    zeichnen();
    timer = setTimeout(fallen, 500);
  };

  $("links").onclick = () => verschieben(-1);
  $("rechts").onclick = () => verschieben(1);
  document.addEventListener("keydown", event => {
    if (!laeuft || !["ArrowLeft", "ArrowRight"].includes(event.key)) return;
    event.preventDefault();
    verschieben(event.key === "ArrowLeft" ? -1 : 1);
  });

  async function anfrage(query, optionen = {}) {
    const controller = new AbortController();
    const frist = setTimeout(() => controller.abort(), 8000);
    try {
      const antwort = await fetch(api + query, {
        ...optionen,
        headers: { apikey: SUPABASE_KEY, ...optionen.headers },
        signal: controller.signal
      });
      if (!antwort.ok) throw new Error("HTTP " + antwort.status);
      return optionen.method === "POST" ? null : await antwort.json();
    } finally {
      clearTimeout(frist);
    }
  }

  async function ranglisteLaden() {
    if (!konfiguriert) {
      $("rangstatus").textContent = "Die Online-Rangliste ist noch nicht verbunden.";
      return;
    }
    const version = ++rangAnfrage;
    try {
      const daten = await anfrage("?select=spieler,punkte&order=punkte.desc,erstellt.asc,id.asc&limit=10");
      if (version !== rangAnfrage) return;
      const eintraege = daten.map(runde => {
        const li = document.createElement("li");
        li.textContent = runde.spieler + " · " + runde.punkte;
        return li;
      });
      $("rang").replaceChildren(...eintraege);
      $("rangstatus").textContent = daten.length ? "" : "Noch keine Ergebnisse.";
    } catch {
      if (version === rangAnfrage) $("rangstatus").textContent = "Rangliste gerade nicht erreichbar.";
    }
  }

  $("eintrag").onsubmit = async event => {
    event.preventDefault();
    if (laeuft || speichert || $("eintrag").hidden) return;
    const spielername = $("name").value.trim();
    if (!spielername) {
      $("status").textContent = "Gib bitte einen Spitznamen ein.";
      return;
    }
    speichert = true;
    $("speichern").disabled = $("start").disabled = true;
    try {
      await anfrage("?on_conflict=id", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Prefer: "resolution=ignore-duplicates,return=minimal"
        },
        body: JSON.stringify({ id: rundenId, spieler: spielername, punkte })
      });
      $("eintrag").hidden = true;
      $("status").textContent = "Punkte gespeichert!";
      await ranglisteLaden();
    } catch {
      $("status").textContent = "Speichern fehlgeschlagen. Versuch es noch einmal.";
    } finally {
      speichert = false;
      $("speichern").disabled = $("start").disabled = false;
    }
  };

  zeichnen();
  ranglisteLaden();
</script>
<!-- Beginn Schwebekurs-Zusatz -->
<style>
  #spielwahl { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.2rem; }
  #spielwahl [aria-pressed="true"] { background: #a6dcff; color: #0b1425; }
  #flugfeld { width: min(100%, 19rem); margin: 1rem auto; display: grid;
    grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #flugfeld .gleiter { background: #81f0c4; }
  #flugfeld .felsen { background: #b69cff; }
  #flugfeld .treffer { background: #ff796e; }
  #flug-eintrag { margin-top: 1rem; }
  #flug-hoch, #flug-start { width: 100%; margin-top: .4rem; }
</style>
<script>
(() => {
  const meteor = document.querySelector("main");
  const nav = document.createElement("nav");
  nav.id = "spielwahl";
  nav.setAttribute("aria-label", "Spiel auswählen");
  nav.innerHTML = `
    <button type="button" aria-pressed="true">Meteor-Ausweichen</button>
    <button type="button" aria-pressed="false">Schwebekurs</button>
    <button type="button" aria-pressed="false">Herzkammern</button>`;

  const flug = document.createElement("div");
  flug.hidden = true;
  flug.innerHTML = `
    <h1>Schwebekurs</h1>
    <p>Dein Gleiter sinkt von selbst. Tippe auf Hoch oder drücke die Leertaste,
      um ein Feld aufzusteigen. Am Boden kannst du bleiben, bis ein Felsen kommt.</p>
    <strong>Punkte: <output id="flug-punkte">0</output></strong>
    <div id="flugfeld" role="img" aria-label="5 mal 5 Spielfelder"></div>
    <button id="flug-hoch" type="button" disabled>↑ Hoch</button>
    <p id="flug-status" role="status">Bereit zum Start.</p>
    <button id="flug-start" type="button">Flug starten</button>
    <form id="flug-eintrag" hidden>
      <label for="flug-name">Spitzname für die Rangliste</label>
      <input id="flug-name" required maxlength="20" autocomplete="off">
      <button id="flug-speichern" type="submit">Punkte speichern</button>
    </form>
    <section>
      <h2>Schwebekurs · Top 10</h2>
      <p id="flug-rangstatus" role="status"></p>
      <ol id="flug-rang"></ol>
    </section>`;
  const meteorInhalt = document.createElement("div");
  while (meteor.firstChild) meteorInhalt.append(meteor.firstChild);
  const herzPanel = document.createElement("section");
  herzPanel.id = "herzkammern-panel";
  herzPanel.hidden = true;
  meteor.append(nav, meteorInhalt, flug, herzPanel);

  const [meteorTab, flugTab, herzTab] = nav.querySelectorAll("button");
  const hoch = flug.querySelector("#flug-hoch");
  const start = flug.querySelector("#flug-start");
  const status = flug.querySelector("#flug-status");
  const feld = flug.querySelector("#flugfeld");
  const anzeige = flug.querySelector("#flug-punkte");
  const eintrag = flug.querySelector("#flug-eintrag");
  const name = flug.querySelector("#flug-name");
  const speichern = flug.querySelector("#flug-speichern");
  const rang = flug.querySelector("#flug-rang");
  const rangstatus = flug.querySelector("#flug-rangstatus");
  const verbunden = typeof konfiguriert !== "undefined" && konfiguriert;
  const flugApi = verbunden
    ? SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/schwebekurs_scores"
    : "";
  let rundenId, speichert = false, rangVersion = 0;
  const zellen = Array.from({ length: 25 }, () => {
    const zelle = document.createElement("span");
    feld.append(zelle);
    return zelle;
  });

  const muster = [[0, 1], [0, 4], [3, 4], [1, 3]];
  let hoehe = 2, takt = 0, punktzahl = 0, steine = [];
  let fliegt = false, flugTimer, meteorPausiert = false;

  function zeichnen(treffer = false) {
    for (const zelle of zellen) zelle.className = "zelle";
    for (const stein of steine) {
      for (const y of stein.zeilen) zellen[y * 5 + stein.x].classList.add("felsen");
    }
    zellen[hoehe * 5 + 1].classList.add(treffer ? "treffer" : "gleiter");
    anzeige.textContent = punktzahl;
  }

  function pruefen() {
    const getroffen = steine.some(stein => stein.x === 1 && stein.zeilen.includes(hoehe));
    zeichnen(getroffen);
    if (!getroffen) return false;
    fliegt = false;
    clearTimeout(flugTimer);
    hoch.disabled = true;
    start.disabled = false;
    start.textContent = "Nochmal fliegen";
    status.textContent = "Flug beendet. Endstand: " + punktzahl;
    eintrag.hidden = !verbunden;
    return true;
  }

  function planeFlug() {
    flugTimer = setTimeout(flugschritt, Math.max(230, 560 - punktzahl * 25));
  }

  function flugschritt() {
    takt += 1;
    if (takt % 2 === 0) hoehe = Math.min(4, hoehe + 1);
    for (const stein of steine) stein.x -= 1;
    steine = steine.filter(stein => stein.x >= 0);
    if (takt % 4 === 0) neuerFelsen();
    if (steine.some(stein => stein.x === 0)) punktzahl += 1;
    if (!pruefen()) planeFlug();
  }

  function neuerFelsen() {
    steine.push({ x: 4, zeilen: muster[Math.floor(Math.random() * muster.length)] });
  }

  start.onclick = () => {
    if (fliegt || speichert) return;
    rundenId = verbunden ? crypto.randomUUID() : null;
    eintrag.hidden = true;
    hoehe = 2;
    takt = 0;
    punktzahl = 0;
    steine = [];
    neuerFelsen();
    fliegt = true;
    start.disabled = true;
    hoch.disabled = false;
    status.textContent = "Du fliegst.";
    zeichnen();
    planeFlug();
  };

  hoch.onclick = () => {
    if (!fliegt || flug.hidden) return;
    hoehe = Math.max(0, hoehe - 1);
    pruefen();
  };

  document.addEventListener("keydown", event => {
    if (flug.hidden || !fliegt || event.code !== "Space") return;
    event.preventDefault();
    if (!event.repeat) hoch.onclick();
  });

  async function flugAnfrage(query, optionen = {}) {
    const controller = new AbortController();
    const frist = setTimeout(() => controller.abort(), 8000);
    try {
      const antwort = await fetch(flugApi + query, {
        ...optionen,
        headers: { apikey: SUPABASE_KEY, ...optionen.headers },
        signal: controller.signal
      });
      if (!antwort.ok) throw new Error("HTTP " + antwort.status);
      if (optionen.method !== "POST") return await antwort.json();
    } finally {
      clearTimeout(frist);
    }
  }

  async function ladeRangliste() {
    if (!verbunden) {
      rangstatus.textContent = "Die Online-Rangliste ist noch nicht verbunden.";
      return;
    }
    const version = ++rangVersion;
    try {
      const ergebnisse = await flugAnfrage(
        "?select=spieler,punkte&order=punkte.desc,erstellt.asc,id.asc&limit=10"
      );
      if (version !== rangVersion) return;
      const zeilen = ergebnisse.map(ergebnis => {
        const li = document.createElement("li");
        li.textContent = ergebnis.spieler + " · " + ergebnis.punkte;
        return li;
      });
      rang.replaceChildren(...zeilen);
      rangstatus.textContent = ergebnisse.length ? "" : "Noch keine Ergebnisse.";
    } catch {
      if (version === rangVersion) rangstatus.textContent = "Rangliste gerade nicht erreichbar.";
    }
  }

  eintrag.onsubmit = async event => {
    event.preventDefault();
    if (fliegt || speichert || eintrag.hidden) return;
    const spieler = name.value.trim();
    if (!spieler) {
      status.textContent = "Gib bitte einen Spitznamen ein.";
      return;
    }
    speichert = true;
    speichern.disabled = start.disabled = true;
    try {
      await flugAnfrage("?on_conflict=id", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Prefer: "resolution=ignore-duplicates,return=minimal"
        },
        body: JSON.stringify({ id: rundenId, spieler, punkte: punktzahl })
      });
      eintrag.hidden = true;
      status.textContent = "Punkte gespeichert! Endstand: " + punktzahl;
      await ladeRangliste();
    } catch {
      status.textContent = "Speichern fehlgeschlagen. Versuch es noch einmal.";
    } finally {
      speichert = false;
      speichern.disabled = start.disabled = false;
    }
  };

  let spiel = "meteor";
  function zeigeSpiel(neu) {
    if (neu === spiel) return;
    if (spiel === "meteor" && laeuft) {
      clearTimeout(timer);
      laeuft = false;
      meteorPausiert = true;
    }
    if (spiel === "flug") clearTimeout(flugTimer);
    spiel = neu;
    meteorInhalt.hidden = neu !== "meteor";
    flug.hidden = neu !== "flug";
    herzPanel.hidden = neu !== "herz";
    meteorTab.setAttribute("aria-pressed", String(neu === "meteor"));
    flugTab.setAttribute("aria-pressed", String(neu === "flug"));
    herzTab.setAttribute("aria-pressed", String(neu === "herz"));

    if (neu === "meteor" && meteorPausiert) {
      meteorPausiert = false;
      laeuft = true;
      timer = setTimeout(fallen, Math.max(150, 500 - punkte * 25));
    } else if (neu === "flug") {
      ladeRangliste();
      if (fliegt) planeFlug();
    }
    herzPanel.dispatchEvent(new Event("arcadespielwechsel"));
  }

  meteorTab.onclick = () => zeigeSpiel("meteor");
  flugTab.onclick = () => zeigeSpiel("flug");
  herzTab.onclick = () => zeigeSpiel("herz");
  function oeffneLink() {
    const links = {"#schwebekurs":"flug","#herzkammern":"herz"};
    zeigeSpiel(links[location.hash] || "meteor");
  }
  oeffneLink();
  window.addEventListener("hashchange", oeffneLink);
  zeichnen();
})();
</script>
<!-- Ende Schwebekurs-Zusatz -->
<template id="herzkammern-vorlage">

<main>
<header><div><h1>Herzkammern</h1><p>Besiege die Monster und erreiche das violette Tor.</p></div></header>
<div class="setup"><label for="modus">Schwierigkeit</label>
<select id="modus"><option value="easy">Leicht</option><option selected value="normal">Normal</option><option value="hard">Schwer</option></select>
<button id="neu" type="button">Spiel starten</button></div>
<p id="regeln"></p>
<div class="layout">
  <section class="panel" aria-label="Spielfeld und Steuerung">
    <div class="hud"><span id="level"></span><span id="leben"></span><span id="punkte"></span></div>
    <div id="board" aria-label="Spielfeld, 10 mal 10"></div>
    <div class="controls">
      <button data-dir="0" aria-label="Nach oben">↑</button><button data-dir="1" aria-label="Nach links">←</button>
      <button data-dir="2" aria-label="Nach unten">↓</button><button data-dir="3" aria-label="Nach rechts">→</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <aside class="panel">
    <h2>Inventar</h2>
    <p id="waffe"></p>
    <div id="slots" aria-label="Inventar mit drei Plätzen"></div>
    <section id="loot" hidden aria-label="Kistenbeute">
      <h2>Kistenbeute</h2><p id="beute-hinweis"></p><div id="angebote"></div>
      <button id="liegen">Liegen lassen</button>
    </section>
    <details open><summary>Steuerung</summary>
      <p>Pfeiltasten oder WASD zum Laufen. Leertaste greift ein erreichbares Monster an. Mit 1–3 wählst du einen Inventarplatz. H trinkt einen Heiltrank. An der Kiste wählst du mit 1–3 die Beute und bei vollem Inventar anschließend den Platz.</p>
      <p>Du kannst auch Felder, Pfeile und Inventar antippen. Monster treffen beim ersten Kontakt sofort für ½ Herz, danach frühestens alle 5 Sekunden.</p>
    </details>
  </aside>
</div>
<section id="wertung" class="panel">
  <h2 id="rangtitel">Rangliste auf diesem Gerät</h2>
  <form id="eintrag" hidden><label for="name">Spitzname</label>
    <input id="name" maxlength="20" required autocomplete="off">
    <button type="submit">Ergebnis speichern</button>
  </form>
  <p id="rangstatus" role="status"></p>
  <p id="rangleer"></p>
  <table><thead><tr><th>Name</th><th>Punkte</th><th>Level geschafft</th><th>Modus</th></tr></thead>
    <tbody id="rang"></tbody>
  </table>
</section>
</main>
</template>
<script>
(() => {

const host = document.getElementById("herzkammern-panel");
const view = host.attachShadow({mode:"open"});
view.append(document.getElementById("herzkammern-vorlage").content.cloneNode(true));
const $ = id => view.getElementById(id);

let pausedAt = host.hidden ? performance.now() : null;
let pausedTime = 0;
const gameNow = () => (pausedAt ?? performance.now()) - pausedTime;
host.addEventListener("arcadespielwechsel", () => {
  const now = performance.now();
  if (host.hidden && pausedAt === null) pausedAt = now;
  if (!host.hidden && pausedAt !== null) {
    pausedTime += now - pausedAt;
    pausedAt = null;
  }
  if (!host.hidden && online) loadOnlineRank();
});
const dirs = [[0,-1],[-1,0],[0,1],[1,0]];
const modes={
  easy:{name:"Leicht",hp:24,enemy:-1,rate:1,bonus:2,heal:6},
  normal:{name:"Normal",hp:20,enemy:0,rate:2,bonus:4,heal:6},
  hard:{name:"Schwer",hp:10,enemy:1,rate:4,bonus:6,heal:2}
};
const items = {
  potion:{name:"Heiltrank"},
  sword:{name:"Schwert",info:"1 ♥ Schaden",damage:2,range:1},
  shield:{name:"Schild",info:"+1 ♥ maximales Leben"},
  bow:{name:"Kurzbogen",info:"½ ♥ Schaden, 3 Felder",damage:1,range:3},
  long:{name:"Langbogen",info:"½ ♥ Schaden, 5 Felder",damage:1,range:5},
  push:{name:"Stoßstab",info:"½ ♥ Schaden, 2 Felder, stößt weg",damage:1,range:2,shift:1},
  pull:{name:"Zughaken",info:"½ ♥ Schaden, 3 Felder, zieht heran",damage:1,range:3,shift:-1}
};
const fist={name:"Faust",damage:1,range:1};
const heart = n => String(n/2).replace(".",",");
const distance = (a,b) => Math.abs(a%10-b%10)+Math.abs(Math.floor(a/10)-Math.floor(b/10));
const inside = (x,y) => x>=0&&x<10&&y>=0&&y<10;
const pick = list => list[Math.floor(Math.random()*list.length)];
const cells = Array.from({length:100},(_,index)=>{
  const cell=document.createElement("button");
  cell.type="button"; cell.tabIndex=-1; cell.onclick=()=>tap(index);
  $("board").append(cell);
  return cell;
});
let level, score, hp, player, exit, chest, walls, monsters, inventory, active, loot, message, ended;
let nextMove=0,nextAttack=0,inventoryView="",lootView="";
let modeKey="normal",mode=modes.normal,playing=false,saved=false,saving=false,runId=null;
const rankKey="herzkammern-rang-v1";
const online=konfiguriert && location.protocol==="https:";
const API=online ? SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/herzkammern_scores" : "";
let rankings=[];
if(!online){try{rankings=JSON.parse(localStorage.getItem(rankKey)||"[]");}catch{}}
if(!Array.isArray(rankings))rankings=[];
const points=n=>String(n/4).replace(".",",");
const maxHp=()=>mode.hp+(inventory.includes("shield")?2:0);
const itemText=key=>key==="potion"?"Heiltrank · +"+heart(mode.heal)+" ♥":items[key].name+" · "+items[key].info;
const weapon=()=>items[inventory[active]]?.damage?items[inventory[active]]:fist;
const enemyAt=pos=>monsters.find(enemy=>enemy.pos===pos);

function neighbors(pos){
  const x=pos%10,y=Math.floor(pos/10);
  return dirs.map(([dx,dy])=>[x+dx,y+dy]).filter(([nx,ny])=>inside(nx,ny)).map(([nx,ny])=>ny*10+nx);
}
function paths(from, blocked){
  const queue=[from], depths=new Map([[from,0]]), first=new Map();
  for(let i=0;i<queue.length;i++){
    const pos=queue[i];
    for(const next of neighbors(pos)){
      if(blocked(next)||depths.has(next))continue;
      depths.set(next,depths.get(pos)+1);
      first.set(next,pos===from?next:first.get(pos)); queue.push(next);
    }
  }
  return {depths,first};
}
function newLevel(){
  player=90+Math.floor(Math.random()*10); walls=new Set();
  const candidates=Array.from({length:100},(_,i)=>i).filter(i=>distance(i,player)>1);
  const count=18+Math.floor(Math.random()*7);
  while(walls.size<count&&candidates.length){
    const nearby=candidates.filter(pos=>neighbors(pos).some(next=>walls.has(next)));
    const pos=pick(nearby.length&&Math.random()<.7?nearby:candidates);
    candidates.splice(candidates.indexOf(pos),1);
    walls.add(pos);
    if(paths(player,n=>walls.has(n)).depths.size!==100-walls.size) walls.delete(pos);
  }
  const {depths}=paths(player,n=>walls.has(n));
  const open=[...depths.keys()].filter(n=>n!==player);
  exit=open.reduce((a,b)=>depths.get(b)>depths.get(a)?b:a);
  chest=pick(open.filter(n=>depths.get(n)>=3&&depths.get(n)<=5&&n!==exit));
  const spawns=open.filter(n=>n!==chest&&n!==exit&&depths.get(n)>=6);
  const firstMove=gameNow()+600;
  monsters=Array.from({length:Math.min(5,3+Math.floor((level-1)/2))},(_,i)=>{
    const index=Math.floor(Math.random()*spawns.length);
    const [pos]=spawns.splice(index,1);
    return {pos,hp:Math.max(1,Math.min(6,2+i%3+Math.floor((level-1)/2))+mode.enemy),strikeAt:0,moveAt:firstMove};
  });
}
function restart(start=false){
  if(saving)return;
  modeKey=$("modus").value||"normal";mode=modes[modeKey];playing=start;saved=false;
  runId=online&&start?crypto.randomUUID():null;
  $("rangstatus").textContent="";
  $("eintrag").hidden=true;
  $("neu").textContent=start?"Neu starten":"Spiel starten";
  level=1; score=0; hp=mode.hp; inventory=[null,null,null]; active=-1; loot=null; ended=false;
  nextMove=0;nextAttack=0;
  message=start?"Finde die Kiste und rüste dich aus.":"Wähle einen Modus und starte das Spiel.";
  newLevel(); draw();
}
function sight(a,b){
  const ax=a%10,ay=Math.floor(a/10),dx=b%10-ax,dy=Math.floor(b/10)-ay;
  const steps=Math.max(Math.abs(dx),Math.abs(dy));
  let x=ax,y=ay;
  for(let i=1;i<=steps;i++){
    const nx=Math.round(ax+dx*i/steps),ny=Math.round(ay+dy*i/steps);
    if(walls.has(ny*10+nx))return false;
    if(nx!==x&&ny!==y&&walls.has(y*10+nx)&&walls.has(ny*10+x))return false;
    x=nx;y=ny;
  }
  return true;
}
function monsterHits(now){
  let hits=0;
  for(const monster of monsters){
    if(distance(monster.pos,player)!==1||now<monster.strikeAt)continue;
    monster.strikeAt=now+5000;
    hits+=1;
    hp-=1;
    if(hp===0){ended=true;playing=false;$("eintrag").hidden=false;break;}
  }
  if(hits){
    message=hits===1?"Ein Monster trifft dich für ½ ♥.":"Monster treffen dich für "+heart(hits)+" ♥.";
    if(ended){loot=null;message+=" Spiel vorbei.";}
  }
  return hits>0;
}
function updateMonsters(){
  if(host.hidden||!playing)return;
  const now=gameNow();
  let moved=false;
  for(const monster of monsters){
    if(now<monster.moveAt)continue;
    monster.moveAt=now+600;
    const gap=distance(monster.pos,player);
    if(gap===1||gap>6||!sight(monster.pos,player))continue;
    const next=paths(monster.pos,pos=>walls.has(pos)||Boolean(enemyAt(pos))).first.get(player);
    if(next!==undefined&&next!==player){monster.pos=next;moved=true;}
  }
  if(monsterHits(now)||moved)draw();
}
function canHit(enemy,used){
  const d=distance(player,enemy.pos), vertical=player%10===enemy.pos%10;
  const aligned=vertical||Math.floor(player/10)===Math.floor(enemy.pos/10);
  if(d>used.range||!aligned||!sight(player,enemy.pos))return false;
  const delta=(vertical?10:1)*Math.sign(enemy.pos-player);
  for(let pos=player+delta;pos!==enemy.pos;pos+=delta){
    if(enemyAt(pos))return false;
  }
  return true;
}
function attack(enemy){
  const now=gameNow();
  if(now<nextAttack)return;
  const used=weapon();
  if(!canHit(enemy,used)){
    message="Ziel außer Reichweite oder Schusslinie blockiert.";draw();return;
  }
  nextAttack=now+300;
  const damage=Math.min(enemy.hp,used.damage);
  enemy.hp-=damage;score+=damage*mode.rate;
  message=used.name+" trifft für "+heart(damage)+" ♥.";
  if(!enemy.hp){
    monsters=monsters.filter(item=>item!==enemy);
    if(!monsters.length)message+=" Das Tor ist offen.";
  }else if(used.shift){
    const dx=Math.sign(enemy.pos%10-player%10)*used.shift;
    const dy=Math.sign(Math.floor(enemy.pos/10)-Math.floor(player/10))*used.shift;
    const x=enemy.pos%10+dx,y=Math.floor(enemy.pos/10)+dy,next=y*10+x;
    if(inside(x,y)&&!walls.has(next)&&next!==player&&!enemyAt(next)){
      enemy.pos=next;enemy.moveAt=now+750;
      message+=used.shift>0?" Das Monster wird weggestoßen.":" Das Monster wird herangezogen.";
    }
  }
  monsterHits(now);draw();
}
function step(pos){
  if(!playing||loot)return;
  const enemy=enemyAt(pos);
  if(enemy){attack(enemy);return;}
  if(!neighbors(player).includes(pos)||walls.has(pos))return;
  const now=gameNow();
  if(now<nextMove)return;
  nextMove=now+150;
  player=pos;
  const hit=monsterHits(now);
  if(ended){draw();return;}
  if(!hit)message="Du bewegst dich.";
  if(pos===exit&&!monsters.length){
    score+=mode.bonus*4;level+=1;hp=Math.min(maxHp(),hp+2);
    newLevel();message="Level geschafft. +"+mode.bonus+" Punkte und bis zu 1 ♥ zurück.";draw();return;
  }
  if(pos===chest){openChest();return;}
  draw();
}
function tap(pos){
  if(!playing||loot)return;
  const enemy=enemyAt(pos);
  if(enemy)attack(enemy);else step(pos);
}
function move(index){
  const [dx,dy]=dirs[index],x=player%10+dx,y=Math.floor(player/10)+dy;
  if(inside(x,y))step(y*10+x);
}
function openChest(){
  chest=null;
  const pool=Object.keys(items).filter(key=>key!=="potion"&&!inventory.includes(key));
  const first=level===1?"sword":pick(pool);
  loot={choices:[first,pick(pool.filter(key=>key!==first)),"potion"],selected:null};
  message="Wähle einen Gegenstand aus der Kiste.";draw();
}
function decide(key){
  if(!loot)return;
  const empty=inventory.indexOf(null);
  if(empty>=0){equipLoot(key,empty);return;}
  loot.selected=key;draw();
}
function equipLoot(key,slot){
  const before=maxHp();
  inventory[slot]=key;
  hp=Math.min(maxHp(),hp+Math.max(0,maxHp()-before));
  if(items[key].damage)active=slot;else if(active===slot)active=-1;
  loot=null;message=items[key].name+" eingepackt.";draw();
}
function chooseSlot(index){
  if(!playing)return;
  if(loot?.selected){equipLoot(loot.selected,index);return;}
  if(loot)return;
  if(inventory[index]==="potion"){drink(index);return;}
  if(!items[inventory[index]]?.damage)return;
  active=active===index?-1:index;draw();
}
function drink(index=inventory.indexOf("potion")){
  if(!playing||loot)return;
  if(index<0){message="Du hast keinen Heiltrank.";draw();return;}
  if(hp===maxHp()){message="Deine Herzen sind bereits voll.";draw();return;}
  const gained=Math.min(mode.heal,maxHp()-hp);
  hp+=gained;inventory[index]=null;
  message="Heiltrank getrunken. +"+heart(gained)+" ♥.";draw();
}
function showMode(){
  const chosen=modes[$("modus").value];
  $("regeln").textContent=heart(chosen.hp)+" ♥ Startleben · "+points(chosen.rate*2)
    +" Punkte pro abgezogenem Herz · "+chosen.bonus+" Punkte pro Level · Heiltrank +"+heart(chosen.heal)+" ♥";
}
function showRank(){
  $("rangleer").textContent=rankings.length?"":"Noch keine Ergebnisse.";
  $("rang").replaceChildren(...rankings.map(entry=>{
    const row=document.createElement("tr");
    for(const value of [entry.name,points(entry.score),entry.levels,modes[entry.mode]?.name||""]){
      const cell=document.createElement("td");cell.textContent=value;row.append(cell);
    }
    return row;
  }));
}
async function scoreRequest(query,options={}){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),8000);
  try{
    const result=await fetch(API+query,{
      ...options,headers:{apikey:SUPABASE_KEY,...options.headers},signal:controller.signal
    });
    if(!result.ok)throw new Error("HTTP "+result.status);
    if(options.method!=="POST")return await result.json();
  }finally{clearTimeout(timer);}
}
async function loadOnlineRank(){
  try{
    const rows=await scoreRequest("?select=spieler,punkte_viertel,level_abschluss,modus&order=punkte_viertel.desc,level_abschluss.desc,erstellt.asc,id.asc&limit=10");
    rankings=rows.map(row=>({name:row.spieler,score:row.punkte_viertel,levels:row.level_abschluss,mode:row.modus}));
    showRank();
  }catch{
    $("rangleer").textContent="Die Online-Rangliste konnte nicht geladen werden.";
  }
}
$("eintrag").onsubmit=async event=>{
  event.preventDefault();
  if(!ended||saved||saving)return;
  const name=$("name").value.trim();
  if(!name){$("rangstatus").textContent="Gib einen Spitznamen ein.";return;}
  const entry={name,score,levels:level-1,mode:modeKey};
  saving=true;
  const submit=$("eintrag").querySelector("button");
  submit.disabled=$("neu").disabled=true;
  try{
    if(online){
      await scoreRequest("?on_conflict=id",{
        method:"POST",
        headers:{"Content-Type":"application/json",Prefer:"resolution=ignore-duplicates,return=minimal"},
        body:JSON.stringify({id:runId,spieler:entry.name,punkte_viertel:entry.score,level_abschluss:entry.levels,modus:entry.mode})
      });
    }else{
      rankings.push(entry);
      rankings.sort((a,b)=>b.score-a.score||b.levels-a.levels);
      rankings=rankings.slice(0,10);
      let persisted=true;
      try{localStorage.setItem(rankKey,JSON.stringify(rankings));}catch{persisted=false;}
      showRank();
      if(!persisted)$("rangstatus").textContent="Ergebnis gilt für diese Vorschau. Dauerhaftes Speichern ist hier gesperrt.";
    }
    saved=true;
    if(online||!$("rangstatus").textContent.startsWith("Ergebnis gilt"))$("rangstatus").textContent="Ergebnis gespeichert.";
    $("eintrag").hidden=true;
    if(online)await loadOnlineRank();
  }catch{
    $("rangstatus").textContent="Speichern fehlgeschlagen. Versuche es erneut.";
  }finally{
    saving=false;
    submit.disabled=$("neu").disabled=false;
  }
};
function draw(){
  $("level").textContent="Level "+level;
  $("leben").textContent=heart(hp)+" / "+heart(maxHp())+" ♥";
  $("punkte").textContent=points(score)+" Pkt.";
  $("status").textContent=message;
  $("waffe").textContent="Aktiv · "+weapon().name+" · "+heart(weapon().damage)+" ♥";
  cells.forEach((cell,pos)=>{
    const enemy=enemyAt(pos);
    let kind=(pos+Math.floor(pos/10))%2?"alt":"",text="",label="Freier Boden";
    if(walls.has(pos)){kind="wall";label="Wand";}
    if(pos===exit){kind=monsters.length?"exit":"exit open";text=monsters.length?"◇":"◆";label=monsters.length?"Tor geschlossen":"Tor offen";}
    if(pos===chest){kind="chest";text="▣";label="Kiste";}
    if(enemy){kind=distance(enemy.pos,player)===1?"foe threat":"foe";label="Monster, "+heart(enemy.hp)+" Herzen";}
    if(pos===player){kind="hero";text="•";label="Deine Figur";}
    cell.className="cell "+kind;cell.title=label;cell.setAttribute("aria-label",label);
    if(enemy){
      const badge=document.createElement("span");
      badge.className="enemy-hp";badge.textContent=heart(enemy.hp)+"♥";
      cell.replaceChildren(badge);
    }else cell.textContent=text;
  });
  const slotsState=JSON.stringify([inventory,active,modeKey]);
  if(slotsState!==inventoryView){
    inventoryView=slotsState;
    $("slots").replaceChildren(...inventory.map((key,index)=>{
    const button=document.createElement("button");button.type="button";
    button.textContent=(index+1)+" · "+(key?itemText(key):"Leer");
    button.setAttribute("aria-pressed",String(active===index));
    button.onclick=()=>chooseSlot(index);
    return button;
  }));
  }
  $("loot").hidden=!loot;
  $("beute-hinweis").textContent=loot?.selected?"Wähle einen Inventarslot zum Ersetzen.":"Nimm einen Gegenstand.";
  const offersState=JSON.stringify(loot);
  if(offersState===lootView)return;
  lootView=offersState;
  $("angebote").replaceChildren(...(loot?.choices??[]).map(key=>{
    const button=document.createElement("button");button.type="button";
    button.textContent=itemText(key);
    button.setAttribute("aria-pressed",String(loot.selected===key));
    button.onclick=()=>decide(key);
    return button;
  }));
}
view.querySelectorAll("[data-dir]").forEach(button=>button.onclick=()=>move(Number(button.dataset.dir)));
document.addEventListener("keydown",event=>{
  if(host.hidden||event.altKey||event.ctrlKey||event.metaKey)return;
  const targetElement = event.composedPath()[0];
  if(targetElement?.matches?.("input,select,textarea,[contenteditable]"))return;
  if(!playing)return;
  const key=event.key.toLowerCase();
  const map={arrowup:0,w:0,arrowleft:1,a:1,arrowdown:2,s:2,arrowright:3,d:3};
  if(Object.hasOwn(map,key)){event.preventDefault();move(map[key]);}
  if(key===" "&&!loot){
    event.preventDefault();
    const used=weapon();
    const target=monsters.filter(enemy=>canHit(enemy,used)).sort((a,b)=>distance(player,a.pos)-distance(player,b.pos))[0];
    if(target)attack(target);
  }
  if(event.repeat)return;
  if(key==="h"){event.preventDefault();drink();}
  if(["1","2","3"].includes(key)){
    event.preventDefault();
    const index=Number(key)-1;
    if(loot&&!loot.selected){if(loot.choices[index])decide(loot.choices[index]);}
    else chooseSlot(index);
  }
});
$("neu").onclick=()=>restart(true);
$("modus").onchange=showMode;
$("liegen").onclick=()=>{if(loot){loot=null;message="Du lässt die Beute zurück.";draw();}};
showMode();restart();
if(online){
  $("rangtitel").textContent="Herzkammern · Online-Top-10";
  if(!host.hidden)loadOnlineRank();
}else showRank();
setInterval(updateMonsters,50);

})();
</script>
</html>
