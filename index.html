<!doctype html>
<html lang="de">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meteor-Ausweichen</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b1425; color: #f2f6ff; font: 1rem system-ui, sans-serif; }
  main { width: min(100% - 2rem, 29rem); margin: 2rem auto; }
  h1 { font-size: clamp(1.8rem, 7vw, 2.6rem); margin: 0; }
  p { color: #c4d2ea; }
  #feld { width: min(100%, 19rem); margin: 1rem auto; display: grid;
    grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .zelle { aspect-ratio: 1; border: 1px solid #304564; border-radius: 7px; background: #16253d; }
  .spieler { background: #77d9ff; }
  .meteor { background: #ff9b6a; }
  .steuerung { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  button, input { min-height: 44px; padding: .65rem .9rem; border-radius: 8px; font: inherit; }
  button { border: 1px solid #506a92; background: #233959; color: white;
    font-weight: 650; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .55; cursor: default; }
  #start { width: 100%; background: #a6dcff; color: #0b1425; }
  #eintrag { margin-top: 1rem; }
  input { width: 100%; margin: .4rem 0; border: 1px solid #506a92; background: #0f1b2e; color: white; }
  section { margin-top: 1.8rem; border-top: 1px solid #304564; }
  li { padding: .35rem .3rem; overflow-wrap: anywhere; }
  #arcade:has(#herzkammern-panel:not([hidden])) { width: min(100% - 2rem, 58rem); }
</style>
<main id="arcade">
  <h1>Meteor-Ausweichen</h1>
  <p>Steuere dein blaues Schiff mit den Tasten unten oder mit ← und →.</p>
  <strong>Punkte: <output id="punkte">0</output></strong>
  <div id="feld" role="img" aria-label="5 mal 5 Spielfelder"></div>
  <div class="steuerung">
    <button id="links" disabled>← Links</button>
    <button id="rechts" disabled>Rechts →</button>
  </div>
  <p id="status" role="status">Bereit zum Start.</p>
  <button id="start">Spiel starten</button>
  <form id="eintrag" hidden>
    <label for="name">Spitzname für die Rangliste</label>
    <input id="name" required maxlength="20" autocomplete="off">
    <button id="speichern">Punkte speichern</button>
  </form>
  <section>
    <h2>Top 10</h2>
    <p id="rangstatus" role="status"></p>
    <ol id="rang"></ol>
  </section>
</main>
<script>
  // Ersetze die beiden Werte zwischen den Anführungszeichen.
  const SUPABASE_URL = "https://bxrlgvsumgxxobynmbta.supabase.co";
  const SUPABASE_KEY = "sb_publishable_D4xcCwNRl7MdP7uqo9_zgQ_gHe47kvw";

  const $ = id => document.getElementById(id);
  const konfiguriert = !SUPABASE_URL.includes("DEIN-PROJEKT")
    && SUPABASE_KEY.startsWith("sb_publishable_")
    && !SUPABASE_KEY.includes("DEIN_SCHLUESSEL");
  const api = SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/meteor_scores";
  const zellen = Array.from({ length: 25 }, () => {
    const zelle = document.createElement("span");
    $("feld").append(zelle);
    return zelle;
  });

  let spieler = 2, meteorX = 2, meteorY = 0, punkte = 0;
  let laeuft = false, timer, rundenId, speichert = false;
  let rangAnfrage = 0;

  function zeichnen() {
    zellen.forEach(zelle => zelle.className = "zelle");
    zellen[20 + spieler].classList.add("spieler");
    zellen[meteorY * 5 + meteorX].classList.add("meteor");
    $("punkte").textContent = punkte;
  }

  function neuerMeteor() {
    meteorX = Math.floor(Math.random() * 5);
    meteorY = 0;
  }

  function pruefeTreffer() {
    if (meteorY !== 4 || meteorX !== spieler) return false;
    laeuft = false;
    clearTimeout(timer);
    $("links").disabled = $("rechts").disabled = true;
    $("start").disabled = false;
    $("start").textContent = "Nochmal spielen";
    $("status").textContent = "Treffer! Endstand: " + punkte;
    $("eintrag").hidden = !konfiguriert;
    return true;
  }

  function verschieben(richtung) {
    if (!laeuft) return;
    spieler = Math.max(0, Math.min(4, spieler + richtung));
    zeichnen();
    pruefeTreffer();
  }

  function fallen() {
    if (!laeuft) return;
    meteorY += 1;
    if (meteorY > 4) {
      punkte += 1;
      neuerMeteor();
    }
    zeichnen();
    if (!pruefeTreffer()) timer = setTimeout(fallen, Math.max(150, 500 - punkte * 25));
  }

  $("start").onclick = () => {
    spieler = 2;
    punkte = 0;
    rundenId = konfiguriert ? crypto.randomUUID() : null;
    laeuft = true;
    $("eintrag").hidden = true;
    $("start").disabled = true;
    $("links").disabled = $("rechts").disabled = false;
    $("status").textContent = "Runde läuft.";
    neuerMeteor();
    zeichnen();
    timer = setTimeout(fallen, 500);
  };

  $("links").onclick = () => verschieben(-1);
  $("rechts").onclick = () => verschieben(1);
  document.addEventListener("keydown", event => {
    if (!laeuft || !["ArrowLeft", "ArrowRight"].includes(event.key)) return;
    event.preventDefault();
    verschieben(event.key === "ArrowLeft" ? -1 : 1);
  });

  async function anfrage(query, optionen = {}) {
    const controller = new AbortController();
    const frist = setTimeout(() => controller.abort(), 8000);
    try {
      const antwort = await fetch(api + query, {
        ...optionen,
        headers: { apikey: SUPABASE_KEY, ...optionen.headers },
        signal: controller.signal
      });
      if (!antwort.ok) throw new Error("HTTP " + antwort.status);
      return optionen.method === "POST" ? null : await antwort.json();
    } finally {
      clearTimeout(frist);
    }
  }

  async function ranglisteLaden() {
    if (!konfiguriert) {
      $("rangstatus").textContent = "Die Online-Rangliste ist noch nicht verbunden.";
      return;
    }
    const version = ++rangAnfrage;
    try {
      const daten = await anfrage("?select=spieler,punkte&order=punkte.desc,erstellt.asc,id.asc&limit=10");
      if (version !== rangAnfrage) return;
      const eintraege = daten.map(runde => {
        const li = document.createElement("li");
        li.textContent = runde.spieler + " · " + runde.punkte;
        return li;
      });
      $("rang").replaceChildren(...eintraege);
      $("rangstatus").textContent = daten.length ? "" : "Noch keine Ergebnisse.";
    } catch {
      if (version === rangAnfrage) $("rangstatus").textContent = "Rangliste gerade nicht erreichbar.";
    }
  }

  $("eintrag").onsubmit = async event => {
    event.preventDefault();
    if (laeuft || speichert || $("eintrag").hidden) return;
    const spielername = $("name").value.trim();
    if (!spielername) {
      $("status").textContent = "Gib bitte einen Spitznamen ein.";
      return;
    }
    speichert = true;
    $("speichern").disabled = $("start").disabled = true;
    try {
      await anfrage("?on_conflict=id", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Prefer: "resolution=ignore-duplicates,return=minimal"
        },
        body: JSON.stringify({ id: rundenId, spieler: spielername, punkte })
      });
      $("eintrag").hidden = true;
      $("status").textContent = "Punkte gespeichert!";
      await ranglisteLaden();
    } catch {
      $("status").textContent = "Speichern fehlgeschlagen. Versuch es noch einmal.";
    } finally {
      speichert = false;
      $("speichern").disabled = $("start").disabled = false;
    }
  };

  zeichnen();
  ranglisteLaden();
</script>
<!-- Beginn Schwebekurs-Zusatz -->
<style>
  #spielwahl { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.2rem; }
  #spielwahl [aria-pressed="true"] { background: #a6dcff; color: #0b1425; }
  #flugfeld { width: min(100%, 19rem); margin: 1rem auto; display: grid;
    grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #flugfeld .gleiter { background: #81f0c4; }
  #flugfeld .felsen { background: #b69cff; }
  #flugfeld .treffer { background: #ff796e; }
  #flug-eintrag { margin-top: 1rem; }
  #flug-hoch, #flug-start { width: 100%; margin-top: .4rem; }
</style>
<script>
(() => {
  const meteor = document.querySelector("main");
  const nav = document.createElement("nav");
  nav.id = "spielwahl";
  nav.setAttribute("aria-label", "Spiel auswählen");
  nav.innerHTML = `
    <button type="button" aria-pressed="true">Meteor-Ausweichen</button>
    <button type="button" aria-pressed="false">Schwebekurs</button>
    <button type="button" aria-pressed="false">Herzkammern</button>`;

  const flug = document.createElement("div");
  flug.hidden = true;
  flug.innerHTML = `
    <h1>Schwebekurs</h1>
    <p>Dein Gleiter sinkt von selbst. Tippe auf Hoch oder drücke die Leertaste,
      um ein Feld aufzusteigen. Am Boden kannst du bleiben, bis ein Felsen kommt.</p>
    <strong>Punkte: <output id="flug-punkte">0</output></strong>
    <div id="flugfeld" role="img" aria-label="5 mal 5 Spielfelder"></div>
    <button id="flug-hoch" type="button" disabled>↑ Hoch</button>
    <p id="flug-status" role="status">Bereit zum Start.</p>
    <button id="flug-start" type="button">Flug starten</button>
    <form id="flug-eintrag" hidden>
      <label for="flug-name">Spitzname für die Rangliste</label>
      <input id="flug-name" required maxlength="20" autocomplete="off">
      <button id="flug-speichern" type="submit">Punkte speichern</button>
    </form>
    <section>
      <h2>Schwebekurs · Top 10</h2>
      <p id="flug-rangstatus" role="status"></p>
      <ol id="flug-rang"></ol>
    </section>`;
  const meteorInhalt = document.createElement("div");
  while (meteor.firstChild) meteorInhalt.append(meteor.firstChild);
  const herzPanel = document.createElement("section");
  herzPanel.id = "herzkammern-panel";
  herzPanel.hidden = true;
  meteor.append(nav, meteorInhalt, flug, herzPanel);

  const [meteorTab, flugTab, herzTab] = nav.querySelectorAll("button");
  const hoch = flug.querySelector("#flug-hoch");
  const start = flug.querySelector("#flug-start");
  const status = flug.querySelector("#flug-status");
  const feld = flug.querySelector("#flugfeld");
  const anzeige = flug.querySelector("#flug-punkte");
  const eintrag = flug.querySelector("#flug-eintrag");
  const name = flug.querySelector("#flug-name");
  const speichern = flug.querySelector("#flug-speichern");
  const rang = flug.querySelector("#flug-rang");
  const rangstatus = flug.querySelector("#flug-rangstatus");
  const verbunden = typeof konfiguriert !== "undefined" && konfiguriert;
  const flugApi = verbunden
    ? SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/schwebekurs_scores"
    : "";
  let rundenId, speichert = false, rangVersion = 0;
  const zellen = Array.from({ length: 25 }, () => {
    const zelle = document.createElement("span");
    feld.append(zelle);
    return zelle;
  });

  const muster = [[0, 1], [0, 4], [3, 4], [1, 3]];
  let hoehe = 2, takt = 0, punktzahl = 0, steine = [];
  let fliegt = false, flugTimer, meteorPausiert = false;

  function zeichnen(treffer = false) {
    for (const zelle of zellen) zelle.className = "zelle";
    for (const stein of steine) {
      for (const y of stein.zeilen) zellen[y * 5 + stein.x].classList.add("felsen");
    }
    zellen[hoehe * 5 + 1].classList.add(treffer ? "treffer" : "gleiter");
    anzeige.textContent = punktzahl;
  }

  function pruefen() {
    const getroffen = steine.some(stein => stein.x === 1 && stein.zeilen.includes(hoehe));
    zeichnen(getroffen);
    if (!getroffen) return false;
    fliegt = false;
    clearTimeout(flugTimer);
    hoch.disabled = true;
    start.disabled = false;
    start.textContent = "Nochmal fliegen";
    status.textContent = "Flug beendet. Endstand: " + punktzahl;
    eintrag.hidden = !verbunden;
    return true;
  }

  function planeFlug() {
    flugTimer = setTimeout(flugschritt, Math.max(230, 560 - punktzahl * 25));
  }

  function flugschritt() {
    takt += 1;
    if (takt % 2 === 0) hoehe = Math.min(4, hoehe + 1);
    for (const stein of steine) stein.x -= 1;
    steine = steine.filter(stein => stein.x >= 0);
    if (takt % 4 === 0) neuerFelsen();
    if (steine.some(stein => stein.x === 0)) punktzahl += 1;
    if (!pruefen()) planeFlug();
  }

  function neuerFelsen() {
    steine.push({ x: 4, zeilen: muster[Math.floor(Math.random() * muster.length)] });
  }

  start.onclick = () => {
    if (fliegt || speichert) return;
    rundenId = verbunden ? crypto.randomUUID() : null;
    eintrag.hidden = true;
    hoehe = 2;
    takt = 0;
    punktzahl = 0;
    steine = [];
    neuerFelsen();
    fliegt = true;
    start.disabled = true;
    hoch.disabled = false;
    status.textContent = "Du fliegst.";
    zeichnen();
    planeFlug();
  };

  hoch.onclick = () => {
    if (!fliegt || flug.hidden) return;
    hoehe = Math.max(0, hoehe - 1);
    pruefen();
  };

  document.addEventListener("keydown", event => {
    if (flug.hidden || !fliegt || event.code !== "Space") return;
    event.preventDefault();
    if (!event.repeat) hoch.onclick();
  });

  async function flugAnfrage(query, optionen = {}) {
    const controller = new AbortController();
    const frist = setTimeout(() => controller.abort(), 8000);
    try {
      const antwort = await fetch(flugApi + query, {
        ...optionen,
        headers: { apikey: SUPABASE_KEY, ...optionen.headers },
        signal: controller.signal
      });
      if (!antwort.ok) throw new Error("HTTP " + antwort.status);
      if (optionen.method !== "POST") return await antwort.json();
    } finally {
      clearTimeout(frist);
    }
  }

  async function ladeRangliste() {
    if (!verbunden) {
      rangstatus.textContent = "Die Online-Rangliste ist noch nicht verbunden.";
      return;
    }
    const version = ++rangVersion;
    try {
      const ergebnisse = await flugAnfrage(
        "?select=spieler,punkte&order=punkte.desc,erstellt.asc,id.asc&limit=10"
      );
      if (version !== rangVersion) return;
      const zeilen = ergebnisse.map(ergebnis => {
        const li = document.createElement("li");
        li.textContent = ergebnis.spieler + " · " + ergebnis.punkte;
        return li;
      });
      rang.replaceChildren(...zeilen);
      rangstatus.textContent = ergebnisse.length ? "" : "Noch keine Ergebnisse.";
    } catch {
      if (version === rangVersion) rangstatus.textContent = "Rangliste gerade nicht erreichbar.";
    }
  }

  eintrag.onsubmit = async event => {
    event.preventDefault();
    if (fliegt || speichert || eintrag.hidden) return;
    const spieler = name.value.trim();
    if (!spieler) {
      status.textContent = "Gib bitte einen Spitznamen ein.";
      return;
    }
    speichert = true;
    speichern.disabled = start.disabled = true;
    try {
      await flugAnfrage("?on_conflict=id", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Prefer: "resolution=ignore-duplicates,return=minimal"
        },
        body: JSON.stringify({ id: rundenId, spieler, punkte: punktzahl })
      });
      eintrag.hidden = true;
      status.textContent = "Punkte gespeichert! Endstand: " + punktzahl;
      await ladeRangliste();
    } catch {
      status.textContent = "Speichern fehlgeschlagen. Versuch es noch einmal.";
    } finally {
      speichert = false;
      speichern.disabled = start.disabled = false;
    }
  };

  let spiel = "meteor";
  function zeigeSpiel(neu) {
    if (neu === spiel) return;
    if (spiel === "meteor" && laeuft) {
      clearTimeout(timer);
      laeuft = false;
      meteorPausiert = true;
    }
    if (spiel === "flug") clearTimeout(flugTimer);
    spiel = neu;
    meteorInhalt.hidden = neu !== "meteor";
    flug.hidden = neu !== "flug";
    herzPanel.hidden = neu !== "herz";
    meteorTab.setAttribute("aria-pressed", String(neu === "meteor"));
    flugTab.setAttribute("aria-pressed", String(neu === "flug"));
    herzTab.setAttribute("aria-pressed", String(neu === "herz"));

    if (neu === "meteor" && meteorPausiert) {
      meteorPausiert = false;
      laeuft = true;
      timer = setTimeout(fallen, Math.max(150, 500 - punkte * 25));
    } else if (neu === "flug") {
      ladeRangliste();
      if (fliegt) planeFlug();
    }
    herzPanel.dispatchEvent(new Event("arcadespielwechsel"));
  }

  meteorTab.onclick = () => zeigeSpiel("meteor");
  flugTab.onclick = () => zeigeSpiel("flug");
  herzTab.onclick = () => zeigeSpiel("herz");
  function oeffneLink() {
    const links = {"#schwebekurs":"flug","#herzkammern":"herz"};
    zeigeSpiel(links[location.hash] || "meteor");
  }
  oeffneLink();
  window.addEventListener("hashchange", oeffneLink);
  zeichnen();
})();
</script>
<!-- Ende Schwebekurs-Zusatz -->
<template id="herzkammern-vorlage">

const fists={key:"fist",name:"Faust",damage:1,range:1,fx:"slash",rank:1};
const has=key=>inventory.some(item=>item?.key===key);
const heart=n=>String(n/2).replace(".",",");
const points=n=>String(n);
const xOf=pos=>pos%10;
const yOf=pos=>Math.floor(pos/10);
const distance=(a,b)=>Math.abs(xOf(a)-xOf(b))+Math.abs(yOf(a)-yOf(b));
const inside=(x,y)=>x>=0&&x<10&&y>=0&&y<10;
const pick=list=>list[Math.floor(Math.random()*list.length)];
const cells=Array.from({length:100},(_,index)=>{
  const cell=document.createElement("button");
  cell.type="button"; cell.tabIndex=-1; cell.onclick=()=>tap(index);
  $("board").append(cell);

});
let level,score,hp,player,exit,walls,monsters,inventory,active,loot,message;
let chestMap,traps,enemyQueue,layout,poisonTicks,face,stashLink;
let nextMove,nextAttack,nextWave,pushAt,pullAt,frostAt,wardAt,vampCharge,vampUntil,quakeUsed;
let inventoryView="",lootView="",hudState="";
let modeKey="normal",mode=modes.normal,playing=false,ended=false,saved=false,saving=false,runId=null;
const rankKey="herzkammern-rang-v2";
const online=konfiguriert&&location.protocol==="https:";
const API=online?SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/herzkammern_scores_v2":"";
let rankings=[];
if(!online){try{rankings=JSON.parse(localStorage.getItem(rankKey)||"[]");}catch{}}
if(!Array.isArray(rankings))rankings=[];
const enemyAt=pos=>monsters.find(enemy=>enemy.pos===pos);
function maxHp(){
  const armor=inventory.filter(item=>item&&items[item.key].health);
  return mode.hp+Math.max(0,...armor.map(item=>items[item.key].health+item.rank-1));
}
function weapon(){
  const item=inventory[active], def=items[item?.key];
  if(!def?.damage)return fists;
  const fixed=["vamp","blade","colossus"].includes(item.key);
  return {...def,...item,damage:def.damage+(fixed?0:item.rank-1)};
}
function itemText(item){
  const {key,rank}=item,def=items[key];
  if(key==="potion")return "Heiltrank · +"+heart(mode.heal)+" ♥";
  if(key==="antidote")return "Gegengift · beendet Gift";
  const roman=["","I","II","III","IV"][rank];
  if(def.health)return def.name+" "+roman+" · +"+heart(def.health+rank-1)+" ♥"+(key==="runic"?" · blockt alle 12 s":"");
  const damage=["vamp","blade","colossus"].includes(key)?def.damage:def.damage+rank-1;
  const info={
    frost:" · "+(1.1+.45*(rank-1)).toFixed(2).replace(".",",")+" s Frost",
    push:" · Stoß alle 2,5 s",pull:" · Zug alle 2,5 s",breaker:" · +1 ♥ gegen Kolosse",
    vamp:" · V nach 4 Treffern",blade:" · trifft im Umkreis von 2 Feldern",colossus:" · R: Erdbeben",
    scythe:" · trifft ein zweites Nahziel",axe:" · ein Wurf alle 2 s"
  };
  return def.name+" "+roman+" · "+heart(damage)+" ♥ · "+def.range+" F"+(info[key]||"");
}
function nextPos(from,dx,dy){
  const x=xOf(from)+dx,y=yOf(from)+dy;
  return inside(x,y)?y*10+x:null;
}
function neighbors(pos){
  return dirs.map(dir=>nextPos(pos,...dir)).filter(next=>next!==null);
}
function paths(from,blocked){
  const queue=[from],depths=new Map([[from,0]]),first=new Map();
  for(let i=0;i<queue.length;i++){
    const pos=queue[i];
    for(const next of neighbors(pos)){
      if(blocked(next)||depths.has(next))continue;
      depths.set(next,depths.get(pos)+1);
      first.set(next,pos===from?next:first.get(pos));
      queue.push(next);
    }
  }
  return {depths,first};
}
function ray(from,dx,dy,length){
  const cells=[];
  for(let i=1;i<=length;i++){
    const pos=nextPos(from,dx*i,dy*i);
    if(pos===null||walls.has(pos))break;
    cells.push(pos);
  }
  return cells;
}
function axis(a,b){
  if(a===b||xOf(a)!==xOf(b)&&yOf(a)!==yOf(b))return null;
  return [Math.sign(xOf(b)-xOf(a)),Math.sign(yOf(b)-yOf(a))];
}
function sight(a,b){
  const dx=xOf(b)-xOf(a),dy=yOf(b)-yOf(a),steps=Math.max(Math.abs(dx),Math.abs(dy));
  let x=xOf(a),y=yOf(a);
  for(let i=1;i<=steps;i++){
    const nx=Math.round(xOf(a)+dx*i/steps),ny=Math.round(yOf(a)+dy*i/steps);
    if(walls.has(ny*10+nx)||nx!==x&&ny!==y&&walls.has(y*10+nx)&&walls.has(ny*10+x))return false;
    x=nx;y=ny;
  }
  return true;
}
function wallCandidates(kind){
  const rect=(x,y,w,h)=>Array.from({length:w*h},(_,i)=>(y+Math.floor(i/w))*10+x+i%w);
  if(kind==="Pfeilerhalle")return [[2,2],[6,2],[2,5],[6,5]].flatMap(([x,y])=>rect(x,y,2,2));
  if(kind==="Ringgang")return [...rect(3,3,4,1),...rect(3,6,4,1),...rect(3,4,1,2),...rect(6,4,1,2)];
  const door=2+Math.floor(Math.random()*6);
  return Array.from({length:10},(_,x)=>40+x).filter(pos=>xOf(pos)!==door&&xOf(pos)!==Math.min(9,door+1));
}
function activeEnemyLimit(){
  return Math.min(mode.maxGroup,mode.firstGroup+Math.floor((level-1)/mode.groupStep));
}
function walkable(pos){
  return pos!==null&&!walls.has(pos);
}
function isChokePoint(pos){
  const up=walkable(nextPos(pos,0,-1)),down=walkable(nextPos(pos,0,1));
  const left=walkable(nextPos(pos,-1,0)),right=walkable(nextPos(pos,1,0));
  return up&&down&&!left&&!right||left&&right&&!up&&!down;
}
function findStashLink(open,depths,gearChest){
  const candidates=[];
  for(const chest of open){
    if(chest===gearChest||chest===exit||depths.get(chest)<3)continue;
    const nearby=neighbors(chest).filter(pos=>walkable(pos)&&pos!==player);
    for(const trap of nearby){
      if(trap===gearChest||trap===exit)continue;
      const vertical=xOf(chest)===xOf(trap);
      // Ein freier Schritt quer zur Schusslinie bleibt als Fluchtweg offen.
      const exits=nearby.filter(pos=>vertical?yOf(pos)===yOf(chest):xOf(pos)===xOf(chest));
      if(exits.length)candidates.push({chest,trap,vertical,escape:pick(exits)});
    }
  }
  const far=candidates.filter(link=>depths.get(link.chest)>=7&&distance(link.chest,exit)>1);
  return pick(far.length?far:candidates)??null;
}
function newLevel(){
  player=90+Math.floor(Math.random()*10);
  face=dirs[0];walls=new Set();monsters=[];traps=new Map();chestMap=new Map();poisonTicks=[];
  quakeUsed=false;
  $("effekte").replaceChildren();
  layout=pick(["Pfeilerhalle","Ringgang","Doppelkammer"]);
  const spread=Array.from({length:100},(_,i)=>i);
  const transpose=layout!=="Doppelkammer"&&Math.random()<.5;
  const template=wallCandidates(layout).map(pos=>transpose?xOf(pos)*10+yOf(pos):pos);
  for(let index=spread.length-1;index>0;index--){
    const swap=Math.floor(Math.random()*(index+1));
    [spread[index],spread[swap]]=[spread[swap],spread[index]];
  }
  const target=layout==="Doppelkammer"?13:15+Math.floor(Math.random()*5);
  for(const pos of [...new Set([...template,...spread])]){
    if(walls.size>=target)break;
    if(distance(pos,player)<2)continue;
    walls.add(pos);
    if(paths(player,n=>walls.has(n)).depths.size!==100-walls.size)walls.delete(pos);
  }
  const {depths}=paths(player,n=>walls.has(n));
  const open=[...depths.keys()].slice(1);
  exit=open.reduce((a,b)=>depths.get(b)>depths.get(a)?b:a);
  const chest=pick(open.filter(pos=>depths.get(pos)>=2&&depths.get(pos)<=4&&pos!==exit));
  chestMap.set(chest,"gear");
  stashLink=level>=2?findStashLink(open,depths,chest):null;
  if(stashLink){
    chestMap.set(stashLink.chest,"stash");
    traps.set(stashLink.trap,{type:"arrow",ready:0,warning:null,line:null,
      vertical:stashLink.vertical,linked:true});
  }
  const trapPool=open.filter(pos=>depths.get(pos)>=3&&pos!==exit&&!chestMap.has(pos)
    &&!traps.has(pos)&&pos!==stashLink?.escape);
  const count=Math.max(traps.size,Math.min(level-mode.trapOffset,20));
  while(traps.size<count&&trapPool.length){
    const narrow=trapPool.filter(isChokePoint);
    const typesForLevel=level>=7?["spike","arrow","crumb"]:level>=4?["spike","arrow"]:["spike"];
    const type=narrow.length?pick(typesForLevel):"arrow";
    const pos=pick(type==="arrow"?trapPool:narrow);
    trapPool.splice(trapPool.indexOf(pos),1);
    traps.set(pos,{type,ready:0,warning:null,line:null,vertical:Math.random()<.5});
  }
  const available=Object.keys(types).filter(key=>types[key].level<=level);
  const introduced=available.find(key=>types[key].level===level);
  enemyQueue=Array.from({length:level+mode.extraEnemies},(_,i)=>i===0&&introduced?introduced:pick(available));
  nextWave=gameNow()+900;
  spawn(Math.min(enemyQueue.length,activeEnemyLimit()),gameNow());
}
function spawn(count,now){
  const {depths}=paths(player,pos=>walls.has(pos));
  const spots=[...depths.keys()].filter(pos=>pos!==player&&pos!==exit&&!enemyAt(pos)&&!chestMap.has(pos)&&!traps.has(pos));
  for(let i=0;i<count&&spots.length&&enemyQueue.length;i++){
    const options=spots.filter(pos=>depths.get(pos)>=4&&distance(pos,player)>=3);
    if(!options.length&&monsters.length)break;
    const pos=options.length?pick(options):spots.reduce((a,b)=>depths.get(b)>depths.get(a)?b:a);
    spots.splice(spots.indexOf(pos),1);
    const key=enemyQueue.shift(),type=types[key];
    monsters.push({pos,key,hp:Math.max(1,2+Math.floor((level-1)/2)+type.hp+mode.enemy),

  }
}
function restart(start=false){
  if(saving)return;
  modeKey=$("modus").value||"normal";mode=modes[modeKey];playing=start;saved=false;ended=false;
  runId=online&&start?crypto.randomUUID():null;

  $("neu").textContent=start?"Neu starten":"Spiel starten";
  level=1;score=0;hp=mode.hp;inventory=[null,null,mode.startPotion?makeItem("potion"):null];active=-1;loot=null;
  nextMove=nextAttack=pushAt=pullAt=frostAt=wardAt=vampCharge=vampUntil=0;
  message=start?(mode.startPotion?"Finde die Ausrüstungskiste. Ein Heiltrank ist in Platz 3.":"Finde die Ausrüstungskiste."):"Wähle einen Modus und starte das Spiel.";
  newLevel();draw();
}
function log(text){message=text;}
function hurt(amount,reason,now,direct=false){
  if(!playing)return;
  if(direct&&has("runic")&&now>=wardAt){
    wardAt=now+12000;log("Das Runenschild blockt "+reason+".");return false;
  }
  const loss=Math.min(hp,amount);
  hp-=loss;log(reason+" · −"+heart(loss)+" ♥");
  if(hp===0){
    ended=true;playing=false;loot=null;
    $("eintrag").hidden=false;message+=" · Spiel vorbei.";
  }
  return loss>0;
}
function heal(amount){
  if(modeKey==="brutal")return 0;
  const gain=Math.max(0,Math.min(amount,maxHp()-hp));
  hp+=gain;return gain;
}
function damageEnemy(enemy,amount){
  if(!monsters.includes(enemy))return;
  enemy.hp-=amount;
  if(enemy.hp>0)return;
  monsters=monsters.filter(other=>other!==enemy);
  score+=modeKey==="brutal"?1:modeKey==="easy"?Math.max(1,types[enemy.key].score-1):types[enemy.key].score;
  if(!monsters.length&&enemyQueue.length)nextWave=gameNow()+900;
}
function tryShift(enemy,dx,dy,now){
  const pos=nextPos(enemy.pos,dx,dy);
  if(enemy.key==="giant"||pos===null||pos===player||walls.has(pos)||enemyAt(pos))return false;
  enemy.pos=pos;

  enemy.warning=null;

}
function startEnemyAttack(enemy,now){
  if(enemy.warning||enemy.frozen>now||enemy.hitAt>now)return false;

    enemy.warning={kind:"blow",cells:[player],at:now+900+mode.warning};
  }else if((enemy.key==="hook"||enemy.key==="thrower")&&dir){
    const cells=ray(enemy.pos,...dir,enemy.key==="hook"?5:4);
    if(cells.includes(player))enemy.warning={kind:enemy.key,cells,at:now+950+mode.warning};
  }
  if(enemy.warning){
    enemy.hitAt=enemy.warning.at+mode.wait;
    return true;
  }
  if(gap!==1)return false;
  enemy.hitAt=now+mode.wait;
  const hit=hurt(type.damage+mode.hit,type.name,now,true);

}
function resolveEnemy(enemy,warning,now){
  const order=warning.cells.indexOf(player);
  if(warning.kind==="hook"){
    if(order<0)return;
    fx("rope",enemy.pos,player);
    for(let i=0;i<2;i++){
      const dir=axis(player,enemy.pos);

      const pos=nextPos(player,...dir);

      player=pos;

    log("Der Hakenwächter zieht dich heran.");

  }
  if(warning.kind==="thrower")fx("arrow",enemy.pos,warning.cells.at(-1));

function armTrap(pos,trap,now){

  trap.warning=now+delay+mode.warning;
  const dir=trap.vertical?[0,1]:[1,0];

function updateHazards(now){
  let changed=false;
  for(const [pos,trap] of traps){
    if(!playing)break;
    const occupied=player===pos||Boolean(enemyAt(pos));
    if(trap.warning!==null&&now>=trap.warning){
      changed=true;
      trap.warning=null;
      trap.ready=now+Math.max(2400,4500-level*55);
      const line=trap.line;
      trap.line=null;
      if(trap.type==="crumb"){
        if(occupied)continue;
        walls.add(pos);
        if(paths(player,p=>walls.has(p)).depths.size===100-walls.size)traps.delete(pos);
        else walls.delete(pos);
        continue;
      }
      const damage=trap.type==="spike"?2:1;
      for(const enemy of [...monsters])if(line.includes(enemy.pos))damageEnemy(enemy,damage);
      if(trap.linked)traps.delete(pos);
      if(line.includes(player))hurt(damage,hazards[trap.type].name,now);
      fx(trap.type==="arrow"?"arrow":"shock",line[0],line.at(-1));
    }else if(!trap.linked&&trap.warning===null&&now>=trap.ready&&occupied){
      changed=true;

function updateMonsters(){
  if(host.hidden||!playing)return;
  const now=gameNow();
  const wasRaging=vampUntil>0;
  if(wasRaging&&now>=vampUntil){vampUntil=0;log("Der Vampirrausch endet.");}
  let changed=wasRaging!==Boolean(vampUntil);
  for(const enemy of monsters){
    if(!playing)break;
    if(enemy.warning&&now>=enemy.warning.at){
      const warning=enemy.warning;enemy.warning=null;
      resolveEnemy(enemy,warning,now);changed=true;continue;
    }
    if(now<enemy.frozen||enemy.warning)continue;
    if(startEnemyAttack(enemy,now)){changed=true;continue;}
    if(now<enemy.next||distance(enemy.pos,player)===1)continue;
    const base=Math.max(285,700-16*(level-1));
    enemy.next=now+base*mode.speed*(enemy.key==="giant"?1.35:1);
    if(distance(enemy.pos,player)>7||!sight(enemy.pos,player))continue;
    const next=paths(enemy.pos,pos=>walls.has(pos)||Boolean(enemyAt(pos))).first.get(player);
    if(next!==undefined&&next!==player){enemy.pos=next;startEnemyAttack(enemy,now);changed=true;}
  }
  if(playing&&poisonTicks.length&&now>=poisonTicks[0]){
    poisonTicks.shift();hurt(1,"Gift",now);changed=true;
  }
  if(playing&&updateHazards(now))changed=true;
  const limit=activeEnemyLimit();
  if(playing&&enemyQueue.length&&monsters.length<limit&&now>=nextWave){
    const before=monsters.length;
    spawn(Math.min(2,limit-before),now);
    nextWave=now+mode.wave;
    if(monsters.length>before){log("Verstärkung kommt.");changed=true;}
  }
  if(changed)draw();else drawAbilities(now);
}
function canHit(enemy,used){
  const gap=distance(player,enemy.pos);
  if(gap>used.range)return false;
  if(used.key==="blade")return sight(player,enemy.pos);
  const dir=axis(player,enemy.pos);
  if(!dir)return false;
  const line=ray(player,...dir,gap);
  return line.includes(enemy.pos)&&!line.slice(0,-1).some(pos=>enemyAt(pos));
}
function attack(enemy){
  if(!playing||loot)return;
  const now=gameNow(),used=weapon();
  if(now<nextAttack)return;
  if(!enemy||!canHit(enemy,used)){log("Kein Gegner in Reichweite.");draw();return;}
  const target=enemy.pos;
  const targets=used.key==="blade"?monsters.filter(other=>canHit(other,used)):[enemy];
  if(used.key==="scythe"){
    const second=monsters.find(other=>other!==enemy&&distance(player,other.pos)===1);
    if(second)targets.push(second);
  }
  const direction=axis(player,target);
  if(direction)face=dirs.find(dir=>dir[0]===direction[0]&&dir[1]===direction[1]);
  nextAttack=now+(used.delay||470);
  const bonus=vampUntil>now?1:0;
  for(const targetEnemy of targets){
    const damage=(used.key==="scythe"&&targetEnemy!==enemy?1:used.damage)
      +(used.key==="breaker"&&targetEnemy.key==="giant"?2:0)+bonus;
    damageEnemy(targetEnemy,damage);
  }
  log(used.name+" · "+targets.length+" Treffer");
  if(used.key==="vamp"&&!vampUntil)vampCharge=Math.min(4,vampCharge+1);
  if(bonus)heal(1);
  const survives=monsters.includes(enemy);
  if(used.key==="push"&&survives&&now>=pushAt){
    if(tryShift(enemy,...direction,now)){pushAt=now+2500;fx("shock",player,target);}
    else fx("slash",player,target);
  }else if(used.key==="pull"&&survives&&now>=pullAt){
    if(tryShift(enemy,-direction[0],-direction[1],now)){pullAt=now+2500;fx("rope",player,target);}
    else fx("slash",player,target);
  }else if(used.key==="frost"){
    if(survives&&now>=frostAt){
      frostAt=now+3000;enemy.frozen=now+1100+450*(used.rank-1);enemy.warning=null;
    }
    fx("ice",player,target);
  }else{
    const effect=used.shift?"slash":used.fx;
    fx(effect,player,target);
  }
  draw();
}

function quake(){

function step(pos){

function quality(key){

function openChest(pos){

  const gear=available.filter(key=>!has(key)||inventory.find(item=>item?.key===key).rank<quality(key)).map(key=>makeItem(key,quality(key)));
  const choices=[];
  if(kind==="gear"){
    const unlock=gear.find(item=>items[item.key].level===level&&level>1)|| (level===1?makeItem("sword"):null);
    if(unlock)choices.push(unlock);
    const upgrade=gear.find(item=>has(item.key)&&!choices.some(other=>other.key===item.key));
    if(upgrade)choices.push(upgrade);
  }
  const remaining=gear.filter(item=>!choices.some(other=>other.key===item.key));

function fx(kind,from,to){
  const svg=$("effekte");
  const node=(tag,attrs)=>{
    const element=document.createElementNS("http://www.w3.org/2000/svg",tag);
    for(const [name,value] of Object.entries(attrs))element.setAttribute(name,String(value));
    return element;
  };
  const x=5+10*xOf(from),y=5+10*yOf(from),tx=5+10*xOf(to),ty=5+10*yOf(to);
  const dx=tx-x,dy=ty-y,angle=Math.atan2(dy,dx)*180/Math.PI;
  let effect;
  if(kind==="slash"){
    effect=node("path",{d:"M 5 -9 Q 18 0 5 9",pathLength:1,transform:"translate("+x+" "+y+") rotate("+angle+")"});
  }else if(kind==="ring"||kind==="shock"&&from===to){
    effect=node("circle",{cx:x,cy:y,r:kind==="ring"?20:5});
  }else if(kind==="shock"){
    effect=node("path",{d:"M 1 -5 Q 14 0 1 5 M 6 -7 Q 20 0 6 7",pathLength:1,transform:"translate("+x+" "+y+") rotate("+angle+")"});
  }else if(kind==="quake"){
    effect=node("path",{d:"M "+x+" "+y+" L "+(x+dx*.25-dy*.11)+" "+(y+dy*.25+dx*.11)
      +" L "+(x+dx*.5+dy*.11)+" "+(y+dy*.5-dx*.11)+" L "+(x+dx*.75-dy*.11)+" "+(y+dy*.75+dx*.11)+" L "+tx+" "+ty});
  }else{
    effect=node("path",{d:"M "+x+" "+y+" L "+tx+" "+ty,pathLength:1});
  }
  effect.setAttribute("class","effekt "+kind);
  svg.append(effect);
  effect.addEventListener("animationend",()=>effect.remove(),{once:true});
  setTimeout(()=>effect.remove(),750);
}

async function scoreRequest(query,options={}){

  try{

      ...options,headers:{apikey:SUPABASE_KEY,...options.headers},signal:controller.signal

    if(!result.ok)throw new Error("HTTP "+result.status);
    if(options.method!=="POST")return await result.json();
  }finally{clearTimeout(timer);}
}
